pluginManagement {
    repositories {
        mavenLocal() // Check your local Maven repository first
        gradlePluginPortal() // Then check the Gradle Plugin Portal
    }
    // TeaVM stopped publishing releases to the Gradle Plugin Portal / their
    // own repo after 0.13.x - releases live on Maven Central, marker-only.
    // Map the plugin id onto the Maven artifact so it resolves from Central
    // (served through the portal repo).
    resolutionStrategy.eachPlugin {
        if (requested.id.id == 'org.teavm') {
            useModule("org.teavm:teavm-gradle-plugin:${requested.version}")
        }
    }
}


include ':processor', ':annotation', ':json_clone', ':luaj'

