apply plugin: 'java'

dependencies {
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
    compileOnly 'com.google.auto.service:auto-service:1.1.1'

    implementation project(path: ':annotation')
    implementation 'com.google.guava:guava:32.0.1-jre'
    implementation 'com.squareup:javapoet:1.11.1'

    // TeaVM build-time reflection SPI (org.teavm.classlib.ReflectionSupplier)
    // used by LuaReflectionSupplier for the html/web build
    compileOnly 'org.teavm:teavm-core:0.13.1'
    // class-name substitution SPI (maps gdx classes onto gdx-teavm's emu
    // re-implementations); SPI exists only in teavm 0.15+
    compileOnly 'org.teavm:teavm-extension-spi:0.15.0'

    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    compileOnly 'org.projectlombok:lombok:1.18.42'
}

java {
    // teavm-core 0.13.1 ships Java 11+ classfiles
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}