// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        agp_version = '8.9.2'
    }
    repositories {
        mavenLocal()
        mavenCentral()
        google()

        maven {
            url "https://artifactory-external.vkpartner.ru/artifactory/maven"
        }
        
        maven { url 'https://developer.huawei.com/repo/' }



    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.4'
        classpath 'com.google.firebase:perf-plugin:1.4.2'
        classpath 'com.google.gms:google-services:4.4.2' // google-services plugin
        classpath 'com.getkeepsafe.dexcount:dexcount-gradle-plugin:1.0.0'
        classpath 'com.huawei.agconnect:agcp:1.4.1.300'
    }
}

plugins {
    // root-level on purpose: the root project exists under every settings.*.gradle
    // variant (desktop/android/html), so spotlessApply/spotlessCheck work with all of them.
    id 'com.diffplug.spotless' version '6.25.0'
}

spotless {
    java {
        // path-based targets: covers android/html sources even when their module
        // is commented out of the active settings file. vendored trees excluded.
        target 'RemixedDungeon/src/**/*.java',
               'RemixedDungeonDesktop/src/**/*.java',
               'RemixedDungeonHtml/src/**/*.java',
               'processor/src/**/*.java'
        targetExclude '**/src/generated/**', '**/ml/BuildConfig.java'
        encoding 'UTF-8'
        removeUnusedImports() // google-java-format: drops unused and duplicate imports
        importOrder()         // sorts alphabetically, merges duplicate import lines
    }
}

