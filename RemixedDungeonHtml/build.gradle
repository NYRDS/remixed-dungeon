import org.gradle.api.file.RelativePath

plugins {
    id 'java'
    id 'org.teavm' version '0.15.0'
}

// Load version information from shared properties file (same as desktop)
def versionPropsFile = file("../version.properties")
def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }

project.ext {
    version = versionProps['VERSION_NAME']
    version_code = versionProps['VERSION_CODE'].toInteger()
    // classlib is mavenLocal()'s fork build (teavm/ remixed-0.15.0 branch);
    // plugin/core/jso-apis/interop come from Maven Central at the same version
    teaVmVersion = '0.15.0'
    // must match the gdx version gdx-teavm 1.3.0 was built against; gradle
    // resolves conflicts to highest anyway, so 1.12.1 here silently became 1.13.5
    gdxVersion = '1.13.5'
    gdxTeaVMVersion = '1.3.0'
}

// TeaVM 0.15.x artifacts are Java-17 bytecode; targeting 11 makes Gradle's
// variant resolution reject them (org.gradle.jvm.version attribute mismatch)
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'src/html/java',                                      // HTML sources first (higher priority)
                    '../RemixedDungeon/src/main/java',                    // shared game sources (lombok runs in compileJava)
                    '../RemixedDungeonDesktop/src/libgdx/java',           // LibGDX backend additions
                    'src/market_none/java',
                    'build/generated/sources/annotationProcessor/java/main'
            ]
            // Exclude desktop-specific classes from the libgdx sources.
            // Scoped to the desktop dir: html shims shadow most desktop classes
            // with their own TeaVM implementations, and a global ant pattern
            // would drop the html copies too (that's what broke platform/audio).
            def desktopLibgdx = project.file('../RemixedDungeonDesktop/src/libgdx/java').absolutePath + '/'
            def htmlShadows = [] as Set
            ['src/html/java', 'src/market_none/java'].each { d ->
                def root = project.file(d)
                root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    if (f.toString().endsWith('.java')) {
                        htmlShadows << root.toPath().relativize(f.toPath()).toString()
                    }
                }
            }
            exclude { e ->
                e.file.absolutePath.startsWith(desktopLibgdx) && (
                    htmlShadows.contains(e.relativePath.pathString) ||
                    e.relativePath.pathString in [
                            'com/nyrds/platform/app/WebServerApp.java',
                            'com/nyrds/platform/app/WebServerOnlyGame.java',
                            'com/nyrds/platform/storage/CaseInsensitiveFileCache.java',
                    ]
                )
            }
        }
        resources {
            srcDirs = [
                    'src/main/resources',
                    'src/html/java',
                    'com'
            ]
        }
    }
}

// Configure Lombok for val/var support in HTML build
compileJava {
    options.compilerArgs << '-Alombok.val.allowed=true'
    options.compilerArgs << '-Alombok.var.allowed=true'
}

// Create a task to generate the BuildConfig.java file
tasks.register('generateBuildConfig') {
    def version = project.ext.version
    def version_code = project.ext.version_code
    doLast {
        def debug = false
        def buildConfigFile = new File("${projectDir}/src/html/java/com/nyrds/pixeldungeon/ml/BuildConfig.java")
        buildConfigFile.parentFile.mkdirs()
        buildConfigFile.text = """
        package com.nyrds.pixeldungeon.ml;

        public class BuildConfig {
            public static final boolean DEBUG = ${debug};
            public static final String SAVES_PATH = "./saves/";
            public static final String FLAVOR_platform = "html";
            public static final String FLAVOR_market = "vkplay";
            public static final String VERSION_NAME = "${version}";
            public static final int VERSION_CODE = ${version_code};
        }
        """
    }
}

tasks.register('codegen', Exec) {
    commandLine 'python3', 'make_r.py'
    doLast {
        exec {
            commandLine 'python3', 'make_json.py'
        }
    }
}

// Ensure BundleHelper is generated before compilation
compileJava.dependsOn generateBuildConfig
compileJava.dependsOn codegen
compileJava.dependsOn ':processor:compileJava'

repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url "https://teavm.org/maven/repository/" }
    maven { url "https://jitpack.io" } // For gdx-teavm
}

dependencies {
    implementation project(':annotation')
    
    implementation project(':json_clone')
    
    compileOnly project(':processor')
    annotationProcessor project(':processor')
    // on the runtime classpath so TeaVM's tool ServiceLoader can pick up
    // LuaReflectionSupplier (META-INF/services/org.teavm.classlib.ReflectionSupplier)
    implementation project(':processor')
    
    implementation project(':luaj')
    implementation 'org.hjson:hjson:3.1.0'
    implementation 'commons-io:commons-io:2.6'
    implementation 'org.jetbrains:annotations:24.1.0'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    implementation 'com.google.guava:guava:32.0.1-jre'
    // NanoHTTPD needed for DebugEndpoints compilation (uses NanoHTTPD.Response and IHTTPSession)
    // Not used at runtime in TeaVM build (no ServerSocket support)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // LibGDX dependencies for HTML backend
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.github.xpenatan.gdx-teavm:backend-teavm:$gdxTeaVMVersion" // Correct dependency name
    // emu FreeType (TeaVM-safe replacement for the stock JNI FreeType class)
    // + freetype.js (emscripten freetype Module, loaded as a preload script)
    implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-teavm:$gdxTeaVMVersion"
    implementation "org.teavm:teavm-classlib:$teaVmVersion"
    implementation "org.teavm:teavm-jso-apis:$teaVmVersion"
    implementation "org.teavm:teavm-interop:$teaVmVersion"

    compileOnly "org.teavm:teavm-core:$teaVmVersion"
    // on the tool classpath: LuaReflectionSupplier (in :processor) links
    // against teavm-core's ReflectionSupplier/ model classes
    implementation "org.teavm:teavm-core:$teaVmVersion"
    // annotationProcessor "org.teavm:teavm-core:$teaVmVersion"  // REMOVED: TeaVM processor interferes with Lombok and custom processor
}

// NOTE: no delombok step. Lombok runs as an annotationProcessor in compileJava
// (val/var enabled above), so the compiled classes TeaVM consumes are already
// lombok-expanded. The old delombok pass only produced thousands of unfixable
// "cannot find symbol" noise lines while duplicating the whole source tree.

// TeaVM configuration - explicit configuration
teavm {
    js {
        mainClass = 'com.nyrds.platform.app.client.TeaVMLauncher'
        targetFileName = 'teavm-app.js'

        // 0.15.0: JS-target reflection is always wired (ServiceLoader'd
        // ReflectionSupplier); the old org.teavm.reflect.enableRef property
        // is gone
        sourceMap = true
        // readable stack traces when debugging boot failures;
        // flip back to true for the shipped artifact
        obfuscated = Boolean.parseBoolean(project.findProperty('teavm.obfuscated') ?: 'false')
    }
}

