# Publish tag builds to Google Play (beta track, 0.2 staged rollout) and upload
# the same APK to RuStore as a draft.
# Replaces the Bitrise `fix` tag workflow - its real config (server-side)
# deploys with track=beta, user_fraction=0.2 (verified on beta.18 build 4222),
# NOT the alpha/fix-track logic in the checked-in bitrise.yml.
# Only runs on tag pushes; the tag must point at a commit on this branch.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   PLAY_SERVICE_ACCOUNT_JSON - Google Play Console API service account key (whole json file)
#   PLAY_KEYSTORE_BASE64      - release keystore .jks, base64-encoded (base64 -w0 file.jks)
#   JKS_KEY_ALIAS             - release keystore key alias
#   JKS_KEY_PASSWORD          - release keystore key password
#   JKS_STORE_PASSWORD        - release keystore store password
#   GOOGLE_SERVICES_JSON      - prod google-services.json (the committed one is a placeholder)
#   API_SIGNATURES_XML        - prod strings_api_signature.xml (real iapKey / ad unit ids;
#                               empty iapKey = all purchases fail)
#   RUSTORE_KEY_ID            - RuStore Public API key id (console.rustore.ru -> API-ключи)
#   RUSTORE_PRIVATE_KEY_BASE64 - private key of the same API key (the base64 body of the
#                               downloaded file; a raw -----BEGIN ... PEM also works)
# The build step overwrites the committed test keystore and templates in the workspace.
#
# Job layout: `build` builds the androidGooglePlay release ONCE (artifact
# googlePlay-apk), then `play` and `rustore` publish it independently - a failure
# in either store upload doesn't affect the other.
#
# The `rustore` job uploads the googlePlay APK (NOT the ruStore flavor: its
# IapAdapter is a stub and its billing strings are placeholders) to RuStore as a
# DRAFT via the RuStore Public API (https://www.rustore.ru/help/work-with-rustore-api/
# api-upload-publication-app). CI never submits for moderation; the draft has
# publishType=MANUAL, so nothing publishes until Mike submits/publishes manually
# in console.rustore.ru. RuStore keeps one draft per app: a new upload replaces
# the previous draft. The API refuses versionCode <= the currently PUBLISHED one;
# the googlePlay APK carries base+10000 (11290+), so it outranks any base-scheme
# version still active on RuStore.
#
# public-api-m.rustore.ru is signed by the Russian national PKI (Russian
# Trusted Root CA) which is NOT in ubuntu-latest CA bundles - the bundle
# (root + sub CA) is passed to curl via --cacert and was verified against
# the live server chain before being committed here.

name: play-release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  build:
    name: Build androidGooglePlay release
    runs-on: ubuntu-latest
    env:
      # lowercase names are what RemixedDungeon/build.gradle signingConfigs reads
      jks_keyAlias: ${{ secrets.JKS_KEY_ALIAS }}
      jks_keyPassword: ${{ secrets.JKS_KEY_PASSWORD }}
      jks_storePassword: ${{ secrets.JKS_STORE_PASSWORD }}
    steps:
      - name: Verify publish secrets are configured
        env:
          SVC_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.JKS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JKS_KEY_PASSWORD }}
          STORE_PASS: ${{ secrets.JKS_STORE_PASSWORD }}
          GSERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          API_SIG: ${{ secrets.API_SIGNATURES_XML }}
        run: |
          missing=()
          [ -z "$SVC_JSON" ]   && missing+=("PLAY_SERVICE_ACCOUNT_JSON")
          [ -z "$KEYSTORE" ]   && missing+=("PLAY_KEYSTORE_BASE64")
          [ -z "$ALIAS" ]      && missing+=("JKS_KEY_ALIAS")
          [ -z "$KEY_PASS" ]   && missing+=("JKS_KEY_PASSWORD")
          [ -z "$STORE_PASS" ] && missing+=("JKS_STORE_PASSWORD")
          [ -z "$GSERVICES" ]  && missing+=("GOOGLE_SERVICES_JSON")
          [ -z "$API_SIG" ]    && missing+=("API_SIGNATURES_XML")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]} (see play-release.yml header)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '${{ github.ref }}'
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Inject prod config and release keystore
        env:
          KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.JKS_STORE_PASSWORD }}
          ALIAS: ${{ secrets.JKS_KEY_ALIAS }}
          GSERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          API_SIG: ${{ secrets.API_SIGNATURES_XML }}
        run: |
          printf '%s' "$GSERVICES" > RemixedDungeon/google-services.json
          printf '%s' "$API_SIG" > RemixedDungeon/src/main/res/values/strings_api_signature.xml
          printf '%s' "$KEYSTORE" | base64 -d > RemixedDungeon/testKey/test.jks
          # fail before a 10-minute build if the decode or credentials are bad
          keytool -list -keystore RemixedDungeon/testKey/test.jks \
            -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null

      - name: Build androidGooglePlay release
        run: |
          chmod +x gradlew
          ./gradlew assembleAndroidGooglePlayRelease -c settings.android.gradle

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: googlePlay-apk
          path: RemixedDungeon/build/outputs/apk/androidGooglePlay/release/*.apk
          if-no-files-found: error

  play:
    name: Publish to Google Play (beta, 0.2 rollout)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify publish secrets are configured
        env:
          SVC_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$SVC_JSON" ] || { echo "::error::Missing secret PLAY_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: googlePlay-apk
          path: RemixedDungeon/build/outputs/apk/androidGooglePlay/release

      - name: Publish to Google Play (beta)
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nyrds.pixeldungeon.ml
          releaseFiles: RemixedDungeon/build/outputs/apk/androidGooglePlay/release/*.apk
          track: beta
          userFraction: '0.2'
          status: inProgress

  rustore:
    name: Upload RuStore draft (manual publish)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify publish secrets are configured
        env:
          RUSTORE_KEY: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIV: ${{ secrets.RUSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          missing=()
          [ -z "$RUSTORE_KEY" ]  && missing+=("RUSTORE_KEY_ID")
          [ -z "$RUSTORE_PRIV" ] && missing+=("RUSTORE_PRIVATE_KEY_BASE64")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]} (see play-release.yml header)"
            exit 1
          fi

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: googlePlay-apk
          path: RemixedDungeon/build/outputs/apk/androidGooglePlay/release

      - name: Upload APK to RuStore as draft
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY_BASE64: ${{ secrets.RUSTORE_PRIVATE_KEY_BASE64 }}
