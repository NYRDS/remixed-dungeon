        run: |
          set -euo pipefail
          PKG=com.nyrds.pixeldungeon.ml
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT

          printf '%s' "$RUSTORE_CA_PEM" > "$TMP/ca.pem"
          # hard check: the decoded bundle holds two certs that chain together
          openssl verify -CAfile "$TMP/ca.pem" "$TMP/ca.pem" > /dev/null

          # private key: raw PEM, or the base64 body the console download gives
          printf '%s' "$RUSTORE_PRIVATE_KEY_BASE64" > "$TMP/key.in"
          if head -c 5 "$TMP/key.in" | grep -q -- '-----'; then
            cp "$TMP/key.in" "$TMP/key.pem"
          else
            base64 -d "$TMP/key.in" > "$TMP/key.pem"
          fi
          openssl pkey -in "$TMP/key.pem" -noout

          # auth: SHA512withRSA (PKCS#1 v1.5) over keyId+timestamp, base64;
          # timestamp must be within +-60s of server time, token ttl 900s
          TS=$(date -u +"%Y-%m-%dT%H:%M:%S.%3N+00:00")
          SIG=$(printf '%s%s' "$RUSTORE_KEY_ID" "$TS" \
            | openssl dgst -sha512 -sign "$TMP/key.pem" | base64 -w0)
          AUTH=$(curl -sS --cacert "$TMP/ca.pem" -X POST 'https://public-api-m.rustore.ru/public/auth' \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg k "$RUSTORE_KEY_ID" --arg t "$TS" --arg s "$SIG" \
              '{keyId:$k,timestamp:$t,signature:$s}')")
          echo "$AUTH" | jq '{code, ttl: .body.ttl}'
          if [ "$(echo "$AUTH" | jq -r '.code // "error"')" != OK ]; then
            echo "::error::RuStore auth failed: $AUTH"; exit 1
          fi
          TOKEN=$(echo "$AUTH" | jq -r '.body.jwe')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = null ]; then
            echo "::error::RuStore auth returned no jwe token"; exit 1
          fi

          # RuStore keeps ONE draft per app: a new create replaces the previous
          # draft. publishType=MANUAL -> stays draft; submitting for moderation
          # (and publishing) remain manual console steps - the CI never does them.
          DRAFT=$(curl -sS --cacert "$TMP/ca.pem" -X POST \
            "https://public-api-m.rustore.ru/public/v1/application/${PKG}/version" \
            -H "Public-Token: ${TOKEN}" -H 'Content-Type: application/json' \
            -d '{"publishType":"MANUAL"}')
          echo "$DRAFT"
          if [ "$(echo "$DRAFT" | jq -r '.code // "error"')" != OK ]; then
            echo "::error::RuStore draft creation failed: $DRAFT"; exit 1
          fi
          VERSION_ID=$(echo "$DRAFT" | jq -r \
            'try (.body.versionId) // try (.content.versionId) // (if (.body|type)=="number" then (.body|tostring) else empty end)')
          if [ -z "$VERSION_ID" ]; then
            echo "::error::no versionId in draft response: $DRAFT"; exit 1
          fi

          APK=$(ls RemixedDungeon/build/outputs/apk/androidGooglePlay/release/*.apk | head -n1)
          echo "Uploading $(basename "$APK") ($(du -h "$APK" | cut -f1)) to draft $VERSION_ID"
          UPLOAD=$(curl -sS --cacert "$TMP/ca.pem" -X POST \
            "https://public-api-m.rustore.ru/public/v1/application/${PKG}/version/${VERSION_ID}/apk?isMainApk=true&servicesType=Unknown" \
            -H "Public-Token: ${TOKEN}" \
            -F "file=@${APK}")
          echo "$UPLOAD"
          if [ "$(echo "$UPLOAD" | jq -r '.code // "error"')" != OK ]; then
            echo "::error::RuStore APK upload failed: $UPLOAD"; exit 1
          fi

          echo "RuStore draft $VERSION_ID created (publishType=MANUAL, no moderation submitted)."
          echo "Next step is manual: review + Submit for Moderation in https://console.rustore.ru/apps/1813367487/versions"
