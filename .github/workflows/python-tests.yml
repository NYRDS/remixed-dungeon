name: python-tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  run-tests:
    name: Run Python HTTP API Tests
    runs-on: ubuntu-latest

    env:
      # tests launch the no-GL headless build (the desktop GUI run needs a
      # display and freezes under --minimized, so it can never work on CI)
      RPD_HEADLESS_JAR: ${{ github.workspace }}/RemixedDungeonHeadless/build/libs/RemixedDungeonHeadless-all.jar
      RPD_GAME_DIR: /tmp/rpd-ci/rundir

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests lxml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build headless jar
        run: ./gradlew :RemixedDungeonHeadless:shadowJar --console=plain

      - name: Generate l10n json
        run: python3 make_json.py
        working-directory: RemixedDungeonDesktop

      - name: Prepare throwaway game dir
        run: |
          mkdir -p /tmp/rpd-ci/rundir
          ln -s "$GITHUB_WORKSPACE/RemixedDungeon/src/main/assets" /tmp/rpd-ci/assets
          ln -s "$GITHUB_WORKSPACE/RemixedDungeonDesktop/src/desktop/d_assets" /tmp/rpd-ci/d_assets
          ln -s "$GITHUB_WORKSPACE/RemixedDungeonDesktop/src/desktop/l10ns" /tmp/rpd-ci/l10ns

      - name: Run Blood Transfusion Tests
        run: python3 tests/http_api/test_blood_transfusion.py
        timeout-minutes: 15

      - name: Run Level Navigation Tests
        run: python3 tests/http_api/test_level_navigation.py
        timeout-minutes: 15

      - name: Run Doctor Spells Tests
        run: python3 tests/http_api/test_doctor_spells.py
        timeout-minutes: 15

      - name: Run All Spells Tests
        run: python3 tests/http_api/test_all_spells.py
        timeout-minutes: 15

      - name: Run Alchemy Tests
        run: python3 tests/http_api/test_alchemy.py
        timeout-minutes: 15
